      <text x="28" y="78" font-size="20" font-weight="700" fill="#0b2e4c">VALIDATE</text>
      <text x="28" y="106" font-size="15" fill="#607184">schema · filter · gap</text>
    </g>
    <path d="M513 163h40" stroke="#8fb4c9" stroke-width="4"/><path d="m553 163-12-8v16z" fill="#8fb4c9"/>
    <g transform="translate(565 95)">
