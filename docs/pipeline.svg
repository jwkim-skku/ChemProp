<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ST Gap prediction pipeline</title>
  <desc id="desc">From molecular CSV data through validation, ChemProp training, evaluation, and error review.</desc>
  <rect width="1200" height="300" rx="24" fill="#f3f7fa"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0b2e4c">ST Gap Prediction Pipeline</text>
  <g font-family="Arial, sans-serif">
